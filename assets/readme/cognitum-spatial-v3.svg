<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="304" aria-labelledby="title desc" role="img" viewBox="0 0 1200 304"><title id="title">Explore Cognitum One</title><desc id="desc">Ambient Intelligence at the edge of the physical world. Open cognitum.one.</desc><defs><linearGradient id="wash" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#102749"/><stop offset=".55" stop-color="#071429"/><stop offset="1" stop-color="#03091a"/></linearGradient><linearGradient id="accent"><stop stop-color="#9ee7ff"/><stop offset="1" stop-color="#348bff"/></linearGradient><radialGradient id="halo"><stop stop-color="#348bff" stop-opacity=".17"/><stop offset="1" stop-color="#348bff" stop-opacity="0"/></radialGradient></defs><style>@keyframes float{0%{transform:translate(0,0)}50%{transform:translate(3px,-10px)}}@keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(-76px)}}@keyframes spark{50%{opacity:.25}}@keyframes breathe{50%{opacity:.4}}@keyframes trace{0%{stroke-dashoffset:0}50%{stroke-dashoffset:90}}@keyframes wave{0%{transform:scale(.5);opacity:.7}}text{font-family:&quot;Avenir Next&quot;,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}.mono{font-family:&quot;SFMono-Regular&quot;,Consolas,&quot;Liberation Mono&quot;,monospace;letter-spacing:1.6px}.float{animation:float 5s ease-in-out infinite}.flow{stroke-dasharray:5 12;animation:flow 5s linear infinite}.trace{stroke-dasharray:400;animation:trace 6s ease-in-out infinite}.scan{animation:scan 7s ease-in-out infinite}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 18s linear infinite}.spark{animation:spark 3.5s ease-in-out infinite}.wave{transform-box:fill-box;transform-origin:center;animation:wave 4s ease-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1199" height="303" x=".5" y=".5" fill="url(#wash)" stroke="#2d4e77" rx="18"/><text x="44" y="42" fill="#78cfff" class="mono" font-size="12" font-weight="500" text-anchor="start">COGNITUM ONE</text><text x="44" y="99" fill="#f3f7ff" font-size="42" font-weight="650" letter-spacing="-.6" text-anchor="start">Ambient Intelligence.</text><text x="44" y="147" fill="#78cfff" font-size="25" font-weight="650" letter-spacing="-.6" text-anchor="start">At the edge of the physical world.</text><text x="44" y="190" fill="#b0c2db" font-size="16" font-weight="500" text-anchor="start">Explore the platform behind the ecosystem.</text><rect width="256" height="46" x="44" y="224" fill="url(#accent)" rx="11"/><text x="65" y="254" fill="#071124" font-size="18" font-weight="500" text-anchor="start">Explore Cognitum</text><path fill="none" stroke="#071124" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M263 247H284M277 240L284 247L277 254"/><circle cx="947" cy="151" r="173" fill="url(#halo)"/><g transform="translate(945 173) scale(1.55)"><path fill="#0b1b35" stroke="#2e5b8e" d="M-82 36L0 -6L82 36L0 78Z"/><path fill="none" stroke="#4473a5" d="M-82 36V-52L0 -94L82 -52V36M-82 -52L0 -10L82 -52M0 -10V78"/><g class="scan"><path fill="#438fff" fill-opacity=".12" stroke="#78cfff" stroke-opacity=".7" d="M-81 32L0 -10L81 32L0 74Z"/></g><circle cx="-40" cy="6" r="2" fill="#438fff" stroke="#438fff" class="spark"/><circle cx="0" cy="-15" r="2" fill="#438fff" stroke="#438fff" class="spark"/><circle cx="40" cy="6" r="2" fill="#438fff" stroke="#438fff" class="spark"/><circle cx="-20" cy="30" r="2" fill="#438fff" stroke="#438fff" class="spark"/><circle cx="20" cy="30" r="2" fill="#438fff" stroke="#438fff" class="spark"/><circle cx="0" cy="49" r="2" fill="#438fff" stroke="#438fff" class="spark"/><g class="orbit"><ellipse cx="0" cy="4" fill="none" stroke="#438fff" stroke-dasharray="2 8" stroke-opacity=".4" rx="102" ry="30"/><circle cx="102" cy="4" r="4" fill="#9ee7ff"/></g><ellipse cx="0" cy="36" fill="none" stroke="#438fff" class="wave" rx="85" ry="28"/></g><g transform="translate(945 145) scale(1.65)"><ellipse cx="0" cy="48" fill="#142c50" opacity=".5" rx="43" ry="12"/><path fill="none" stroke="#2e527d" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M-43 48L0 27L43 48L0 69Z"/><g class="float"><path fill="none" stroke="#78cfff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M0 -38L31 -20V18L0 38L-31 18V-20ZM-31 -20L0 -1L31 -20M0 -1V38"/><path fill="none" stroke="#438fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M-15 1L-5 11L17 -12" class="trace"/></g></g><ellipse cx="945" cy="150" fill="none" stroke="#437cb2" stroke-dasharray="5 18" class="flow" rx="140" ry="30" transform="rotate(-25 945 150)"/><ellipse cx="945" cy="150" fill="none" stroke="#437cb2" stroke-dasharray="5 18" class="flow" rx="160" ry="43" transform="rotate(-25 945 150)"/><ellipse cx="945" cy="150" fill="none" stroke="#437cb2" stroke-dasharray="5 18" class="flow" rx="180" ry="56" transform="rotate(-25 945 150)"/></svg>