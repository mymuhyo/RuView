<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="396" aria-labelledby="title desc" role="img" viewBox="0 0 1200 396"><title id="title">RuView sensing overview</title><desc id="desc">Conceptual sequence: capture RF, extract context, act locally. Links to architecture and user documentation.</desc><defs><linearGradient id="wash" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#102749"/><stop offset=".55" stop-color="#071429"/><stop offset="1" stop-color="#03091a"/></linearGradient><linearGradient id="accent"><stop stop-color="#9ee7ff"/><stop offset="1" stop-color="#348bff"/></linearGradient><radialGradient id="halo"><stop stop-color="#348bff" stop-opacity=".17"/><stop offset="1" stop-color="#348bff" stop-opacity="0"/></radialGradient></defs><style>@keyframes float{0%{transform:translate(0,0)}50%{transform:translate(3px,-10px)}}@keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(-76px)}}@keyframes spark{50%{opacity:.25}}@keyframes breathe{50%{opacity:.4}}@keyframes trace{0%{stroke-dashoffset:0}50%{stroke-dashoffset:90}}@keyframes wave{0%{transform:scale(.5);opacity:.7}}text{font-family:&quot;Avenir Next&quot;,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}.mono{font-family:&quot;SFMono-Regular&quot;,Consolas,&quot;Liberation Mono&quot;,monospace;letter-spacing:1.6px}.float{animation:float 5s ease-in-out infinite}.flow{stroke-dasharray:5 12;animation:flow 5s linear infinite}.breathe{animation:breathe 4s ease-in-out infinite}.trace{stroke-dasharray:400;animation:trace 6s ease-in-out infinite}.scan{animation:scan 7s ease-in-out infinite}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 18s linear infinite}.spark{animation:spark 3.5s ease-in-out infinite}.wave{transform-box:fill-box;transform-origin:center;animation:wave 4s ease-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1199" height="395" x=".5" y=".5" fill="url(#wash)" stroke="#2d4e77" rx="18"/><text x="36" y="44" fil