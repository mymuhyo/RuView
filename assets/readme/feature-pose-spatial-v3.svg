<svg xmlns="http://www.w3.org/2000/svg" width="580" height="276" aria-labelledby="title desc" role="img" viewBox="0 0 580 276"><title id="title">Pose research</title><desc id="desc">Train and compare body keypoints. Live accuracy differs from benchmarks. Conceptual animation; follow the linked source for capability limits.</desc><defs><linearGradient id="wash" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#102749"/><stop offset=".55" stop-color="#071429"/><stop offset="1" stop-color="#03091a"/></linearGradient><linearGradient id="accent"><stop stop-color="#9ee7ff"/><stop offset="1" stop-color="#348bff"/></linearGradient><radialGradient id="halo"><stop stop-color="#348bff" stop-opacity=".17"/><stop offset="1" stop-color="#348bff" stop-opacity="0"/></radialGradient></defs><style>@keyframes float{0%{transform:translate(0,0)}50%{transform:translate(3px,-10px)}}@keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(-76px)}}@keyframes spark{50%{opacity:.25}}@keyframes breathe{50%{opacity:.4}}@keyframes trace{0%{stroke-dashoffset:0}50%{stroke-dashoffset:90}}@keyframes wave{0%{transform:scale(.5);opacity:.7}}text{font-family:&quot;Avenir Next&quot;,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}.mono{font-family:&quot;SFMono-Regular&quot;,Consolas,&quot;Liberation Mono&quot;,monospace;letter-spacing:1.6px}.float{animation:float 5s ease-in-out infinite}.flow{stroke-dasharray:5 12;animation:flow 5s linear infinite}.breathe{animation:breathe 4s ease-in-out infinite}.scan{animation:scan 7s ease-in-out infinite}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 18s linear infinite}.spark{animation:spark 3.5s ease-in-out infinite}.wave{transform-box:fill-box;transform-origin:center;animation:wave 4s ease-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="579" height="275" x=".5" y=".5" fill="url(#wash)" stroke="#2d4e77" rx="18"/><text x="30" y="39" fill="#78cfff" class="mono" font-size="11" font-weight="500" text-anchor="start">RUVIEW / 03</text><text x="30" y="94" fill="#f3f7ff" font-size="29" font-weight="650" letter-spacing="-.6" text-anchor="start">Pose research</text><text x="30" y="136" fill="#b0c2db" font-size="16" font-weight="500" text-anchor="start">Train and compare body keypoints.</text><text x="30" y="164" fill="#b0c2db" font-size="16" font-weight="500" text-anchor="start">Live accuracy differs from benchmarks.</text><circle cx="465" cy="170" r="110" fill="url(#halo)"/><g transform="translate(480 161) scale(0.53)"><path fill="#0b1b35" stroke="#2e5b8e" d="M-82 36L0 -6L82 36L0 78Z"/><path fill="none" stroke="#4473a5" d="M-82 36V-52L0 -94L82 -52V36M-82 -52L0 -10L82 -52M0 -10V78"/><g class="scan"><path fill="#438fff" fill-opacity=".12" stroke="#78cfff" stroke-opacity=".7" d="M-81 32L0 -10L81 32L0 74Z"/></g><circle cx="-40" cy="6" r="2" fill="#438fff" stroke="#438fff" class="spark"/><circle cx="0" cy="-15" r="2" fill="#438fff" stroke="#438fff" class="spark"/><circle cx="40" cy="6" r="2" fill="#438fff" stroke="#438fff" class="spark"/><circle cx="-20" cy="30" r="2" fill="#438fff" stroke="#438fff" class="spark"/><circle cx="20" cy="30" r="2" fill="#438fff" stroke="#438fff" class="spark"/><circle cx="0" cy="49" r="2" fill="#438fff" stroke="#438fff" class="spark"/><g class="orbit"><ellipse cx="0" cy="4" fill="none" stroke="#438fff" stroke-dasharray="2 8" stroke-opacity=".4" rx="102" ry="30"/><circle cx="102" cy="4" r="4" fill="#9ee7ff"/></g><ellipse cx="0" cy="36" fill="none" stroke="#438fff" class="wave" rx="85" ry="28"/></g><g transform="translate(474 155) scale(0.68)"><ellipse cx="0" cy="48" fill="#142c50" opacity=".5" rx="43" ry="12"/><path fill="none" stroke="#2e527d" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M-43 48L0 27L43 48L0 69Z"/><g class="float"><circle cx="0" cy="-28" r="8" fill="none" stroke="#b8f36c"/><path fill="none" stroke="#b8f36c" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M0 -20V12M-24 -