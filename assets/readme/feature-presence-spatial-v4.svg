<svg xmlns="http://www.w3.org/2000/svg" width="580" height="276" aria-labelledby="title desc" role="img" viewBox="0 0 580 276"><title id="title">Presence &amp; motion</title><desc id="desc">Explore changes in room occupancy. Inspect motion features from CSI. Conceptual animation; follow the linked source for capability limits.</desc><defs><linearGradient id="wash" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#102749"/><stop offset=".55" stop-color="#071429"/><stop offset="1" stop-color="#03091a"/></linearGradient><linearGradient id="accent"><stop stop-color="#9ee7ff"/><stop offset="1" stop-color="#348bff"/></linearGradient><radialGradient id="halo"><stop stop-color="#348bff" stop-opacity=".17"/><stop offset="1" stop-color="#348bff" stop-opacity="0"/></radialGradient></defs><style>@keyframes float{0%{transform:translate(0,0)}50%{transform:translate(3px,-10px)}}@keyframes sweep{0%{transform:rotate(-20deg)}50%{transform:rotate(155deg)}}@keyframes spark{50%{opacity:.25}}text{font-family:&quot;Avenir Next&quot;,&quot;Segoe UI Variable Display&quot;,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}.mono{font-family:&quot;SFMono-Regular&quot;,Consolas,&quot;Liberation Mono&quot;,monospace;letter-spacing:1.6px}.float{animation:float 5s ease-in-out infinite}.flow{stroke-dasharray:5 12;animation:flow 5s linear infinite}.spark{animation:spark 3.5s ease-in-out infinite}.sweep{animation:sweep 5s ease-in-out infinite;transform-origin:0 0}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="579" height="275" x=".5" y=".5" fill="url(#wash)" stroke="#2d4e77" rx="18"/><text x="30" y="39" fill="#78cfff" class="mono" font-size="11" font-weight="500" text-anchor="start">RUVIEW / 01</text><text x="30" y="89" fill="#f3f7ff" font-size="25" font-weight="650" letter-spacing="-.6" text-anchor="start">Presence &amp; motion</text><text x="30" y="126" fill="#b0c2db" font-size="14" font-weight="500" text-anchor="start">Explore changes in room occupancy.</text><t