<svg xmlns="http://www.w3.org/2000/svg" width="580" height="276" aria-labelledby="title desc" role="img" viewBox="0 0 580 276"><title id="title">Breathing &amp; vital signals</title><desc id="desc">Inspect phase-derived signal trends. Validate estimates on your hardware. Conceptual animation; follow the linked source for capability limits.</desc><defs><linearGradient id="wash" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#102749"/><stop offset=".55" stop-color="#071429"/><stop offset="1" stop-color="#03091a"/></linearGradient><linearGradient id="accent"><stop stop-color="#9ee7ff"/><stop offset="1" stop-color="#348bff"/></linearGradient><radialGradient id="halo"><stop stop-color="#348bff" stop-opacity=".17"/><stop offset="1" stop-color="#348bff" stop-opacity="0"/></radialGradient></defs><style>@keyframes float{0%{transform:translate(0,0)}50%{transform:translate(3px,-10px)}}@keyframes cursor{0%{transform:translateX(-35px);opacity:.3}50%{transform:translateX(35px);opacity:1}}@keyframes trace{0%{stroke-dashoffset:0}50%{stroke-dashoffset:90}}text{font-family:&quot;Avenir Next&quot;,&quot;Segoe UI Variable Display&quot;,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}.mono{font-family:&quot;SFMono-Regular&quot;,Consolas,&quot;Liberation Mono&quot;,monospace;letter-spacing:1.6px}.float{animation:float 5s ease-in-out infinite}.flow{stroke-dasharray:5 12;animation:flow 5s linear infinite}.trace{stroke-dasharray:400;animation:trace 6s ease-in-out infinite}.cursor{animation:cursor 5s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="579" height="275" x=".5" y=".5" fill="url(#wash)" stroke="#2d4e77" rx="18"/><text x="30" y="39" fill="#78cfff" class="mono" font-size="11" font-weight="500" text-anchor="start">RUVIEW / 02</text><text x="30" y="89" fill="#f3f7ff" font-size="25" font-weight="650" letter-spacing="-.6" text-anchor="start">Breathing &amp; vital signals</text><text x="30" y="126" fill="#b0c2db" font-size="14" font-weight="500" text-anchor="start">Inspect phase-derived signal trends.</text><text x="30" y="151" fill="#b0c2db" font-size="14" font-weight="500" text-anchor="start">Validate estimates on your hardware.</text><circle cx="465" cy="170" r="110" fill="url(#halo)"/><g transform="translate(480 144) scale(1.12)"><ellipse cy="53" fill="#020816" opacity=".65" rx="48" ry="8"/><g class="float"><path style="animation-delay:0s" fill="none" stroke="#78cfff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M-49 -14C-34 -14 -30 -35 -17 -35S0 7 14 7S34 -14 49 -14" class="trace" opacity="1"/><path style="animation-delay:-1s" fill="none" stroke="#b8f36c" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M-49 -2C-34 -2 -30 -23 -17 -23S0 19 14 19S34 -2 49 -2" class="trace" opacity=".8"/><path style="animation-delay:-2s" fill="none" stroke="#78cfff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M-49 10C-34 10 -30 -11 -17 -11S0 31 14 31S34 10 49 10" class="trace" opacity=".6"/><g class="cursor"><path fill="none" stroke="#ffb45e" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M0 -42V40"/><circle cx="0" cy="-8" r="3" fill="#ffb45e" stroke="#ffb45e"/></g></g></g><path fill="none" stroke="#2d4e77" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M30 204H550"/><path fill="none" stroke="#78cfff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M30 204H550" class="flow" opacity=".5"/><text x="30" y="245" fill="#78cfff" class="mono" font-size="12" font-weight="500" text-anchor="start">SIGNAL PIPELINE</text><path fill="none" stroke="#78cfff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M510 239H540M532 231L540 239L532 247"/><path stroke="url(#accent)" d="M24 1H556" opacity=".55"/><path stroke="#438fff" d="M24 275H556" opacity=".15"/></svg>