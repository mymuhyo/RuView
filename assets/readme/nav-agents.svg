<svg xmlns="http://www.w3.org/2000/svg" width="180" height="116" aria-labelledby="title desc" role="img" viewBox="0 0 180 116"><title id="title">AI toolkit</title><desc id="desc">Open AI toolkit. Animated navigation icon.</desc><defs><linearGradient id="wash" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b303a"/><stop offset=".55" stop-color="#06171e"/><stop offset="1" stop-color="#030c13"/></linearGradient><linearGradient id="accent"><stop stop-color="#91f6df"/><stop offset="1" stop-color="#26bad7"/></linearGradient><radialGradient id="halo"><stop stop-color="#35d4db" stop-opacity=".17"/><stop offset="1" stop-color="#35d4db" stop-opacity="0"/></radialGradient></defs><style>@keyframes float{0%{transform:translate(0,0)}50%{transform:translate(3px,-10px)}}@keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(-76px)}}@keyframes spark{50%{opacity:.25}}@keyframes breathe{50%{opacity:.4}}@keyframes trace{0%{stroke-dashoffset:0}50%{stroke-dashoffset:90}}text{font-family:&quot;Avenir Next&quot;,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}.float{animation:float 5s ease-in-out infinite}.flow{stroke-dasharray:5 12;animation:flow 5s linear infinite}.breathe{animation:breathe 4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="179" height="115" x=".5" y=".5" fill="url(#wash)" stroke="#245360" rx="18"/><g transform="translate(90 45) scale(0.65)"><ellipse cx="0" cy="48" fill="#133a45" opacity=".5" rx="43" ry="12"/><path fill="none" stroke="#285c68" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M-43 48L0 27L43 48L0 69Z"/><g class="float"><path fill="none" stroke="#70b6ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M0 0L0 -33" class="flow"/><circle cx="0" cy="-33" r="7" fill="none" stroke="#72eee0" class="breathe"/><path fill="none" stroke="#70b6ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M0 0L-35 23" class="flow"/><circle cx="-35" cy="23" r="7" fill="none" stroke="#72eee0" class="breathe"/><path fill="none" stroke="#70b6ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M0 0L35 23" class="flow"/><circle cx="35" cy="23" r="7" fill="none" stroke="#72eee0" class="breathe"/><circle cx="0" cy="0" r="15" fill="none" stroke="#72eee0"/><path fill="none" stroke="#72eee0" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M-6 0L-1 5L8 -6"/></g></g><text x="90" y="98" fill="#ecfafb" font-size="16" font-weight="500" text-anchor="middle">AI toolkit</text></svg>